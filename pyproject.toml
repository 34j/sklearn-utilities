[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "sklearn-utilities"
version = "0.5.14"
description = "Utilities for scikit-learn."
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "lightgbm>=4.1,<5",
  "pandas>=2.1.1,<3",
  "scikit-learn>=1.3.1,<2",
  "tqdm-joblib>=0.0.4,<0.1",
  "typing-extensions>=4.8,<5",
]
urls."Bug Tracker" = "https://github.com/34j/sklearn-utilities/issues"
urls.Changelog = "https://github.com/34j/sklearn-utilities/blob/main/CHANGELOG.md"
urls.documentation = "https://sklearn-utilities.readthedocs.io"
urls.repository = "https://github.com/34j/sklearn-utilities"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
  "sphinx-rtd-theme",
]
catboost = [
  "catboost>=1.2.2,<1.3",
]
seaborn = [
  "seaborn>=0.13,<0.14",
]
torch = [
  "skorch>=0.15,<0.16",
  "torch>=2.1,<3",
]

[tool.ruff]
extend = ".venv/ruff.toml"

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true

[tool.semantic_release]
version_variables = [
  "src/sklearn_utilities/__init__.py:__version__",
  "docs/conf.py:release",
]
version_toml = [ "pyproject.toml:project.version" ]
build_command = "uv build"
branches.main.match = "main"
changelog.environment.keep_trailing_newline = true
changelog.exclude_commit_patterns = [
  "chore*",
  "ci*",
]
