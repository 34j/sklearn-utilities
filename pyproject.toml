[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "sklearn-utilities"
version = "1.0.0"
description = "Utilities for scikit-learn."
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "lightgbm>=4.7.0",
  "pandas>=2.1.1",
  "scikit-learn>=1.3.1",
  "tqdm-joblib>=0.0.4",
  "typing-extensions>=4.8",
]
optional-dependencies.catboost = [
  "catboost>=1.2.2",
]
optional-dependencies.seaborn = [
  "seaborn>=0.13",
]
optional-dependencies.torch = [
  "skorch>=1",
  "torch>=2.1",
]
urls."Bug Tracker" = "https://github.com/34j/sklearn-utilities/issues"
urls.Changelog = "https://github.com/34j/sklearn-utilities/blob/main/CHANGELOG.md"
urls.documentation = "https://sklearn-utilities.readthedocs.io"
urls.repository = "https://github.com/34j/sklearn-utilities"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pytest",
  "pytest-cov",
  "ty>=0.0.10",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.ignore = [
  "ARG",
  "B",
  "BLE",
  "D",
  "DOC",
  "FBT",
  "G",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PLC",
  "PLR",
  "PLW",
  "PT",
  "PYI",
  "RET",
  "RUF",
  "SIM",
  "SLF",
  "T",
  "TC",
  "TID",
  "TRY",
  "UP046",
  "UP047",
]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
